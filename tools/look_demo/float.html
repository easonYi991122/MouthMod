<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MouthMod 悬浮窗</title>
<style>
:root {
  --bg: #16181d; --panel: #20232a; --line: #2f333c; --fg: #e6e6e6; --muted: #8a8f98;
  --ok: #2ea44f; --warn: #d4a72c; --bad: #d73a49; --accent: #7cc4ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg);
  font: 13px/1.4 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
#panel { padding: 10px; max-width: 360px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge { padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 15px; background: var(--muted); color: #fff; }
.muted { color: var(--muted); font-size: 12px; }
.box { background: var(--panel); border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
#keys { font: 700 22px/1.2 Menlo, Consolas, monospace; color: var(--accent); }
#btn { font-size: 14px; }
.grid { display: grid; grid-template-columns: 112px 1fr; gap: 8px; align-items: center; }
#look { font: 12px/1.45 Menlo, Consolas, monospace; white-space: pre; }
#chan { font: 12px/1.5 Menlo, Consolas, monospace; white-space: pre; }
button { font: inherit; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--line);
  background: var(--panel); color: var(--fg); cursor: pointer; }
button:hover { border-color: var(--muted); }
button.stop { border-color: var(--bad); }
label { display: flex; align-items: center; gap: 6px; }
.tune { display: grid; grid-template-columns: auto 64px auto 64px; gap: 4px 6px; align-items: center; }
input[type=number], input[type=text] { width: 100%; font: inherit; padding: 2px 4px; border-radius: 4px;
  border: 1px solid var(--line); background: #0f1115; color: var(--fg); }
#log { font: 11px/1.4 Menlo, Consolas, monospace; color: var(--muted); white-space: pre-wrap; min-height: 6.5em; }
#hint { color: var(--warn); font-size: 12px; }
</style>
</head>
<body>
<div id="panel">
  <div class="row">
    <span id="state" class="badge">未连接</span>
    <span id="link" class="muted"></span>
    <button id="btnPip" style="margin-left:auto">弹出置顶悬浮窗</button>
  </div>
  <div id="front" class="muted" style="margin-top:4px">前台: ?</div>

  <div class="box">
    <div class="muted">游戏实际收到</div>
    <div class="row"><span id="keys">—</span><span id="btn" style="margin-left:auto">左键 ○</span></div>
  </div>

  <div class="grid">
    <canvas id="cv" width="112" height="112" style="background:var(--panel);border-radius:6px"></canvas>
    <div id="look">—</div>
  </div>
  <div id="chan" class="box">—</div>

  <div class="row" style="margin:6px 0">
    <button data-cmd="arm">启用</button>
    <button class="stop" data-cmd="x">停用 (Esc)</button>
    <button data-cmd="ack">确认故障</button>
    <button data-cmd="get">刷新</button>
  </div>
  <label><input type="checkbox" id="chkHid">真实键鼠输出 (hid)</label>
  <label><input type="checkbox" id="chkGate" checked>只在 Minecraft 前台时输出</label>

  <div class="tune box">
    <span class="muted">起转角 °</span><input type="number" id="p_dead" step="0.5" min="0" max="12">
    <span class="muted">确认 ms</span><input type="number" id="p_confirm" step="10" min="0" max="300">
    <span class="muted">左右 kx</span><input type="number" id="p_kx" step="5" min="0" max="150">
    <span class="muted">上下 ky</span><input type="number" id="p_ky" step="5" min="0" max="150">
  </div>
  <form id="cmdForm" class="row">
    <input type="text" id="cmdIn" placeholder="命令，例如 act w 2000 / chan breath 0" autocomplete="off" style="flex:1;min-width:0">
    <button type="submit">发送</button>
  </form>
  <div id="hint"></div>
  <div id="log"></div>
</div>

<script>
'use strict';
// Talks to bridge.py (same origin): SSE /events in, POST /cmd out.
// Rendering is driven by incoming events, not timers, so it keeps updating
// while this tab is hidden behind Minecraft and only the floating
// (Document Picture-in-Picture) window is visible.
const panel = document.getElementById('panel');
const $ = (id) => panel.querySelector('#' + id);
const STATE = {
  DISARMED: ['停用', '#8a8f98'], CALIBRATING: ['校准中 · 保持静止', '#d4a72c'],
  WAIT_NEUTRAL: ['等待回中', '#d4a72c'], ACTIVE: ['启用', '#2ea44f'], FAULT: ['故障 · 需确认', '#d73a49'],
};
let D = null, S = null, P = {}, keys = '-', btn = '0', front = null, frontName = '?';
let logLines = [], sumX = 0, sumY = 0, rateX = 0, rateY = 0, rateT = performance.now();
let lastDraw = 0, faultWhy = '';
// Why the board is latched in FAULT; the #E line scrolls out of the log fast.
const FAULT_WHY = {
  fault_imu_timeout: 'IMU 无数据', fault_imu_init: 'IMU 初始化失败',
  fault_breath_timeout: '吹吸模块无读数（没接或松了？）', fault_bite_timeout: '咬合模块无读数（没接或松了？）',
};

function kv(parts) { const o = {}; for (const p of parts) { const i = p.indexOf('='); if (i > 0) o[p.slice(0, i)] = p.slice(i + 1); } return o; }
function send(cmd) { fetch('/cmd', { method: 'POST', body: cmd }).catch(() => log('发送失败: ' + cmd)); }
function cmd(c) { send(c); if (c !== 'get') log('> ' + c); }
function log(t) { logLines = logLines.concat(t).slice(-6); $('log').textContent = logLines.join('\n'); }

function handle(line) {
  if (line.startsWith('D,')) {
    const f = line.split(',');
    if (f.length >= 24) { D = f; sumX += +f[18] || 0; sumY += +f[19] || 0; }
    return;
  }
  if (line.startsWith('S,')) { S = line.split(','); return; }
  const parts = line.split(',');
  switch (parts[0]) {
    case '#P':
      P = kv(parts.slice(1));
      $('chkHid').checked = P.hid === '1';
      if ('fgate' in P && (P.fgate === '1') !== $('chkGate').checked) send('fgate ' + ($('chkGate').checked ? 1 : 0));
      for (const k of ['dead', 'confirm', 'kx', 'ky']) {
        const el = $('p_' + k);
        if (k in P && el.ownerDocument.activeElement !== el) el.value = +P[k];
      }
      break;
    case '#K': { const i = kv(parts.slice(2)); keys = i.keys || '-'; btn = i.left || '0'; break; }
    case '#F': log('前台门控: ' + (kv(parts.slice(2)).front === '1' ? '放行' : '拦截')); break;
    case '#E':
      if (parts[3] === 'FAULT' && parts[2] !== 'fault_ack') faultWhy = FAULT_WHY[parts[2]] || parts[2];
      log('事件 ' + parts.slice(2).join(' → ')); break;
    case '#OK': case '#ERR': case '#C': log(line); break;
    case '#BRIDGE':
      if (parts[1] === 'front') { frontName = parts[2]; front = parts[3] === '1'; }
      else {
        $('link').textContent = '板子 ' + parts.slice(1, 3).join(' ');
        if (parts[1] === 'connected') { send('get'); send('fgate ' + ($('chkGate').checked ? 1 : 0)); }
      }
      break;
  }
}

function render() {
  const now = performance.now();
  if (now - rateT >= 1000) { rateX = sumX; rateY = sumY; sumX = sumY = 0; rateT = now; }
  if (D) { const [t, c] = STATE[D[3]] || [D[3], '#8a8f98']; $('state').textContent = t; $('state').style.background = c; }
  const gate = $('chkGate').checked;
  if (front === null) { $('front').textContent = '前台: 未知（前台检测需要 macOS 上的 bridge.py）'; $('front').style.color = ''; }
  else {
    $('front').textContent = `前台: ${front ? '✓ Minecraft' : '✗ ' + frontName}    门控${gate ? '开' : '关'}`;
    $('front').style.color = front ? 'var(--ok)' : (gate && $('chkHid').checked ? 'var(--warn)' : '');
  }
  $('keys').textContent = keys === '-' ? '—' : keys;
  $('btn').textContent = btn === '1' ? '左键 ●' : '左键 ○';
  $('btn').style.color = btn === '1' ? 'var(--accent)' : '';
  drawLook();
  if (S && S.length >= 17) {
    const dot = (v) => (v === '1' ? '●' : '○');
    $('chan').textContent =
      `摇杆 ${S[6].padEnd(3)} (${(+S[4]).toFixed(2)}, ${(+S[5]).toFixed(2)})\n` +
      `吹吸 p=${S[9]}  吹${dot(S[10])} 吸${dot(S[11])}  咬${dot(S[15])}`;
  }
  let hint = '';
  if (D && D[3] === 'FAULT') {
    hint = `故障${faultWhy ? '：' + faultWhy : '（原因见日志 #E 行）'}。此时视角和按键都不输出：排除原因后点「确认故障」，再启用`;
  } else if (D && D[3] === 'ACTIVE' && D[20] !== '1') {
    hint = '已启用，但「真实键鼠输出」没勾：小图里视角在动，游戏却收不到任何指令';
  } else if (D && D[20] === '1' && gate && front === false) {
    hint = '真实输出已开，但 Minecraft 不在前台：按键和视角被拦截（点回游戏窗口即可）';
  }
  $('hint').textContent = hint;
}

function drawLook() {
  const cv = $('cv'), c = cv.getContext('2d'), w = cv.width, cx = w / 2, span = 25, sc = (w / 2 - 6) / span;
  c.clearRect(0, 0, w, w);
  const dead = +(P.dead || 6), rel = Math.max(0, dead - +(P.hyst || 2));
  c.strokeStyle = '#2a2d35'; c.beginPath(); c.moveTo(cx, 4); c.lineTo(cx, w - 4); c.moveTo(4, cx); c.lineTo(w - 4, cx); c.stroke();
  for (const [e, col] of [[dead, '#4a5d7d'], [rel, '#2f3a4f']]) { c.strokeStyle = col; c.strokeRect(cx - e * sc, cx - e * sc, 2 * e * sc, 2 * e * sc); }
  if (!D) return;
  const re = +D[14], pe = +D[15], vx = +D[16], vy = +D[17];
  const clamp = (v) => Math.max(-span, Math.min(span, v));
  c.fillStyle = (vx || vy) ? '#2ea44f' : '#8a8f98';
  c.beginPath(); c.arc(cx + clamp(re) * sc, cx + clamp(pe) * sc, 5, 0, 2 * Math.PI); c.fill();
  $('look').textContent =
    `roll 误差 ${re >= 0 ? '+' : ''}${re.toFixed(1)}°\npitch误差 ${pe >= 0 ? '+' : ''}${pe.toFixed(1)}°\n` +
    `速度 ${vx.toFixed(0)} / ${vy.toFixed(0)} c/s\n每秒 ${rateX} / ${rateY} ${D[20] === '1' ? 'HID' : '虚拟'}\n` +
    `起转 ${dead}° 确认 ${P.confirm ?? '?'}ms`;
}

// ---------------------------------------------------------------- wiring
function connect() {
  const es = new EventSource('/events');
  es.onopen = () => { $('link').textContent = '已连接本地桥'; send('get'); };
  es.onmessage = (e) => {
    handle(e.data);
    const now = performance.now();
    if (now - lastDraw >= 100) { lastDraw = now; render(); }
  };
  es.onerror = () => { $('link').textContent = '桥断开，重连中…'; };
}
panel.querySelectorAll('button[data-cmd]').forEach((b) => { b.onclick = () => cmd(b.dataset.cmd); });
$('chkHid').onchange = () => cmd('hid ' + ($('chkHid').checked ? 1 : 0));
$('chkGate').onchange = () => cmd('fgate ' + ($('chkGate').checked ? 1 : 0));
for (const k of ['dead', 'confirm', 'kx', 'ky']) $('p_' + k).onchange = (e) => cmd(`set ${k} ${e.target.value}`);
$('cmdForm').onsubmit = (e) => { e.preventDefault(); const v = $('cmdIn').value.trim(); if (v) cmd(v); $('cmdIn').value = ''; };
function onKey(e) { if (e.key === 'Escape') cmd('x'); }
document.addEventListener('keydown', onKey);

// Document Picture-in-Picture: an always-on-top window above other apps
// (Chrome / Edge 116+). The panel moves into it and back when it closes.
$('btnPip').onclick = async () => {
  if (!('documentPictureInPicture' in window)) { log('此浏览器不支持置顶悬浮窗，请用 Chrome 或 Edge'); return; }
  let pip;
  try {
    pip = await documentPictureInPicture.requestWindow({ width: 360, height: 640 });
  } catch (e) {
    log('悬浮窗打开失败：' + e.message + '。请在桌面版 Chrome / Edge 中打开本页');
    return;
  }
  for (const s of document.querySelectorAll('style')) pip.document.head.appendChild(s.cloneNode(true));
  pip.document.title = 'MouthMod';
  pip.document.body.appendChild(panel);
  pip.document.addEventListener('keydown', onKey);
  $('btnPip').style.display = 'none';
  pip.addEventListener('pagehide', () => { document.body.appendChild(panel); $('btnPip').style.display = ''; });
};
window.addEventListener('beforeunload', () => { navigator.sendBeacon('/cmd', 'disarm'); });
connect();
render();
</script>
</body>
</html>
